<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VI Manager – Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vhi.css">
  <style>
    .mp-tabs { display: flex; gap: 4px; margin: 0 0 1rem; }
    .mp-tab { padding: 9px 18px; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--text-dim); border: 1px solid transparent; border-bottom: none; font-weight: 600; font-size: 13.5px; }
    .mp-tab.active { background: var(--bg-card); color: var(--text); border-color: var(--border); }
    .mp-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .mp-toolbar input[type=text] { flex: 0 0 320px; }
    .mp-toolbar .spacer { flex: 1; }
    .mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .mp-grid .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .mp-grid .os-icon { font-size: 26px; }
    .mp-grid h3 { font-size: 15px; font-weight: 700; word-break: break-word; }
    .mp-grid .meta { color: var(--text-dim); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .mp-grid .deploy-row { margin-top: auto; padding-top: 12px; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--bg-dark); color: var(--text-dim); }
    .badge.active { color: #2ecc71; }
    .badge.warn { color: #f1c40f; }
    .badge.off { color: #e74c3c; }
    .ci-warn { display: none; margin-top: 8px; padding: 9px 12px; border: 1px solid #f1c40f; border-radius: 7px; font-size: 12.5px; color: #f1c40f; }
    .empty { color: var(--text-dim); text-align: center; padding: 60px 0; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: flex-start; justify-content: center; z-index: 100; overflow-y: auto; padding: 40px 16px; }
    .overlay.open { display: flex; }
    .overlay .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 560px; padding: 26px 28px 24px; }
    .overlay .modal h2 { font-size: 17px; margin-bottom: 4px; }
    .overlay .modal .sub { color: var(--text-dim); font-size: 12.5px; }
    .overlay .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .hint { font-size: 12px; color: var(--text-dim); margin-top: 5px; }
    .status-msg { margin-top: 14px; font-size: 13px; display: none; }
    .status-msg.error { color: #e74c3c; display: block; }
    .status-msg.ok { color: #2ecc71; display: block; }
    .desc { color: var(--text-dim); font-size: 12px; }
    #tab-scripts table { width: 100%; border-collapse: collapse; }
    #tab-scripts th, #tab-scripts td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body data-nav="marketplace">
<div id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">
      <span class="vz-brand">Infrastructure System (V/IS)</span>
      <h1>VI Manager</h1>
      <p>Connect to your infrastructure cluster</p>
    </div>
    <div class="form-group">
      <label>Cluster Address</label>
      <input type="text" id="loginHost" value="172.16.218.7" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUser" value="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="advanced-toggle" id="advToggle" type="button">
      <span id="advArrow">▶</span> <span>Advanced Options</span>
    </button>
    <div class="advanced-fields" id="advFields">
      <div class="advanced-grid">
        <div class="form-group">
          <label>User Domain</label>
          <input type="text" id="loginUserDomain" value="Default">
        </div>
        <div class="form-group">
          <label>Project Domain</label>
          <input type="text" id="loginProjDomain" value="Default">
        </div>
      </div>
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="loginProject" value="admin">
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" id="discoverBtn" type="button">Discover</button>
      <button class="btn btn-primary" id="connectBtn" type="button">Connect</button>
    </div>
    <div class="login-status" id="loginStatus"></div>
  </div>
</div>

<div id="appShell">
  <header class="app-header">
    <span class="logo">Infrastructure System (V/IS)</span>
    <span class="spacer"></span>
    <a href="/clusters" class="btn-chat-toggle" style="text-decoration:none; margin-right:0.5rem;">🌐 Clusters</a>
    <button class="btn-chat-toggle" id="themeToggle" style="margin-right:0.5rem">🌓 Theme</button>
    <button class="btn-logout" id="logoutBtn">Disconnect</button>
  </header>
  <div class="app-body">
    <nav class="sidebar" id="appSidebar"></nav>
    <main class="content">
      <div class="panel active">
        <div class="panel-header">
          <h2>Marketplace</h2>
          <span class="panel-badge">Templates and scripts</span>
        </div>
        <div class="mp-tabs">
          <div class="mp-tab active" data-tab="templates">VM Templates</div>
          <div class="mp-tab" data-tab="scripts">Script Repository</div>
        </div>
        <section id="tab-templates">
          <div class="mp-toolbar">
            <input type="text" id="tplSearch" placeholder="Search templates…">
            <div class="spacer"></div>
            <span class="hint" id="tplHiddenNote"></span>
            <button class="btn btn-secondary" id="tplRefresh">↻ Refresh</button>
          </div>
          <div class="mp-grid" id="tplGrid"><div class="empty">Loading templates…</div></div>
        </section>
        <section id="tab-scripts" style="display:none">
          <div class="mp-toolbar">
            <div class="spacer"></div>
            <button class="btn btn-primary" id="newScriptBtn">+ New Script</button>
          </div>
          <div class="table-card">
            <table>
              <thead><tr><th>Name</th><th>Description</th><th>Updated</th><th style="width:140px"></th></tr></thead>
              <tbody id="scriptRows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<div id="toast"></div>

<div class="overlay" id="deployOverlay">
  <div class="modal">
    <h2 id="deployTitle">Deploy VM</h2>
    <div class="sub" id="deploySub"></div>
    <label>VM Name</label>
    <input type="text" id="depName" placeholder="my-new-vm">
    <div class="row2">
      <div>
        <label>Flavor</label>
        <select id="depFlavor"></select>
      </div>
      <div>
        <label>Boot Volume (GB)</label>
        <input type="number" id="depDisk" min="1" value="20">
      </div>
    </div>
    <label>Network</label>
    <select id="depNetwork"></select>
    <label>Post-Provision Script (cloud-init)</label>
    <select id="depScript"></select>
    <textarea id="depScriptContent" rows="9" spellcheck="false" style="margin-top:8px; display:none"></textarea>
    <div class="ci-warn" id="depCiWarn"></div>
    <div class="hint">Runs on first boot via cloud-init.</div>
    <div class="status-msg" id="deployStatus"></div>
    <div class="actions">
      <button class="btn btn-secondary" id="depCancel">Cancel</button>
      <button class="btn btn-primary" id="depGo">Deploy</button>
    </div>
  </div>
</div>

<div class="overlay" id="scriptOverlay">
  <div class="modal">
    <h2 id="scriptModalTitle">New Script</h2>
    <label>Name</label>
    <input type="text" id="scrName" placeholder="Install PostgreSQL">
    <label>Description</label>
    <input type="text" id="scrDesc" placeholder="What this script sets up">
    <label>Script Content</label>
    <textarea id="scrContent" rows="14" spellcheck="false" placeholder="#cloud-config"></textarea>
    <div class="status-msg" id="scriptStatus"></div>
    <div class="actions">
      <button class="btn btn-secondary" id="scrCancel">Cancel</button>
      <button class="btn btn-primary" id="scrSave">Save Script</button>
    </div>
  </div>
</div>

<script src="/js/vhi-common.js"></script>
<script src="/js/marketplace.js"></script>
</body>
</html>
